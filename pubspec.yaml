name: labor_notify_app
description: "A Flutter web app to celebrate Baby Evie's arrival with countdown and notifications."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0   # Flutter/Dart SDK compatibility (keep under 3.9 for now)

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase packages (stable)
  firebase_core: ^2.32.0
  cloud_functions: ^4.7.1
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/stork.png
    - assets/images/ultrasound.png
    - assets/images/butterfly_bw.png

  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
